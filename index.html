<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="La historia de Azul y Trufa, un cuento de amor en el bosque encantado.">
  <title>Azul y Trufa 🍄💙</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="introFog" class="intro-fog" aria-live="polite">
    <div class="fog-inner">
      <div class="mist mist-one"></div>
      <div class="mist mist-two"></div>
      <button id="enterButton" class="enter-button" type="button">Pulsame</button>
    </div>
  </div>

  <main class="page-shell">
    <section class="hero" aria-labelledby="title">
      <div class="moon" aria-hidden="true"></div>
      <div class="mushroom mushroom-one" aria-hidden="true">🍄</div>
      <div class="mushroom mushroom-two" aria-hidden="true">🍄</div>
      <p class="eyebrow">Un cuento del bosque encantado</p>
      <h1 id="title">Azul <span>y</span> Trufa</h1>
      <p class="subtitle">Dos seres diferentes. Un amor extraordinario.</p>
      <div class="button-group">
        <a class="start-button" href="#historia">Leer la historia ↓</a>
        <a class="start-button" href="game.html">Jugar 🎮</a>
      </div>
    </section>

    <article id="historia" class="story-card">
      <div class="story-heading">
        <span class="ornament">✦</span>
        <h2>La historia de Azul y Trufa</h2>
        <span class="ornament">✦</span>
      </div>
      <div id="story" class="story-content" aria-live="polite">
        <p>Cargando la historia...</p>
      </div>
    </article>

    <section class="carousel-section" aria-label="Galería visual de la historia">
      <div class="carousel-header">
        <span class="eyebrow mini">Momentos del cuento</span>
        <h3>Imágenes del bosque</h3>
      </div>
      <div class="carousel-shell">
        <button class="carousel-btn prev" type="button" aria-label="Anterior">‹</button>
        <div class="carousel-window">
          <div id="carouselTrack" class="carousel-track" aria-live="polite"></div>
        </div>
        <button class="carousel-btn next" type="button" aria-label="Siguiente">›</button>
      </div>
    </section>

    <footer>Hecho con magia, rocío y mucho cariño 🍄💙</footer>
  </main>

  <script>
    const storySlides = [
      {
        title: 'El bosque lunar',
        text: 'Un claro mágico iluminado por la luna y los hongos brillantes.',
        accent: '#a8d4d3',
        emoji: '🌙'
      },
      {
        title: 'Azul',
        text: 'El pequeño pitufo con su gorro rojo y su mirada llena de ternura.',
        accent: '#2f74d6',
        emoji: '🧑‍🦰'
      },
      {
        title: 'Trufa',
        text: 'La trufa más bella del bosque, delicada, curiosa y profunda.',
        accent: '#8b5e3c',
        emoji: '🍄'
      },
      {
        title: 'Su amor',
        text: 'Juntos descubren un claro mágico donde la magia florece.',
        accent: '#ffd166',
        emoji: '💙'
      }
    ];

    const track = document.getElementById('carouselTrack');
    let currentSlide = 0;

    function createSlide(slide, index) {
      const item = document.createElement('article');
      item.className = 'carousel-slide' + (index === 0 ? ' is-active' : '');
      item.innerHTML = `
        <div class="slide-art" style="background: linear-gradient(135deg, ${slide.accent}, rgba(255,255,255,0.22));">
          <span>${slide.emoji}</span>
        </div>
        <div class="slide-copy">
          <h4>${slide.title}</h4>
          <p>${slide.text}</p>
        </div>
      `;
      return item;
    }

    function renderCarousel() {
      track.innerHTML = '';
      storySlides.forEach((slide, index) => {
        track.appendChild(createSlide(slide, index));
      });
      updateCarouselPosition();
    }

    function updateCarouselPosition() {
      const slides = Array.from(track.children);
      slides.forEach((slide, index) => {
        slide.classList.toggle('is-active', index === currentSlide);
      });
      const offset = -currentSlide * 100;
      track.style.transform = `translateX(${offset}%)`;
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % storySlides.length;
      updateCarouselPosition();
    }

    function prevSlide() {
      currentSlide = (currentSlide - 1 + storySlides.length) % storySlides.length;
      updateCarouselPosition();
    }

    document.querySelector('.carousel-btn.next').addEventListener('click', nextSlide);
    document.querySelector('.carousel-btn.prev').addEventListener('click', prevSlide);
    setInterval(nextSlide, 4500);
    renderCarousel();

    const introFog = document.getElementById('introFog');
    const enterButton = document.getElementById('enterButton');

    enterButton.addEventListener('click', () => {
      introFog.classList.add('is-closing');
      setTimeout(() => {
        introFog.style.display = 'none';
      }, 1400);
    });

    fetch('mensaje')
      .then(response => {
        if (!response.ok) throw new Error('No se pudo cargar la historia');
        return response.text();
      })
      .then(text => {
        const story = document.querySelector('#story');
        story.replaceChildren();
        text.trim().split(/\n\s*\n/).forEach(block => {
          const lines = block.trim().split('\n').map(line => line.trim()).filter(Boolean);
          if (!lines.length) return;
          if (lines.every(line => line.startsWith('-'))) {
            const list = document.createElement('ul');
            lines.forEach(line => {
              const item = document.createElement('li');
              item.textContent = line.replace(/^-\s*/, '');
              list.appendChild(item);
            });
            story.appendChild(list);
          } else {
            const paragraph = document.createElement('p');
            paragraph.textContent = lines.join(' ');
            if (/^✨|^FIN/.test(paragraph.textContent)) paragraph.className = 'story-title';
            if (/^"/.test(paragraph.textContent)) paragraph.className = 'quote';
            story.appendChild(paragraph);
          }
        });
      })
      .catch(() => {
        document.querySelector('#story').innerHTML = '<p>No se pudo cargar la historia. Puedes abrir el archivo <em>mensaje</em> del repositorio para leerla.</p>';
      });
  </script>
</body>
</html>
