<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="blueSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5ccc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Body glow effect -->
  <circle cx="100" cy="120" r="65" fill="#4a90e2" opacity="0.1" filter="url(#shadow)"/>
  
  <!-- Legs -->
  <ellipse cx="85" cy="200" rx="12" ry="28" fill="url(#blueSkin)" filter="url(#shadow)"/>
  <ellipse cx="115" cy="200" rx="12" ry="28" fill="url(#blueSkin)" filter="url(#shadow)"/>
  
  <!-- Shoes -->
  <ellipse cx="85" cy="230" rx="16" ry="12" fill="#333" filter="url(#shadow)"/>
  <ellipse cx="115" cy="230" rx="16" ry="12" fill="#333" filter="url(#shadow)"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="130" rx="40" ry="55" fill="url(#blueSkin)" filter="url(#shadow)"/>
  
  <!-- Arms -->
  <ellipse cx="60" cy="115" rx="15" ry="35" fill="url(#blueSkin)" transform="rotate(-25 60 115)" filter="url(#shadow)"/>
  <ellipse cx="140" cy="115" rx="15" ry="35" fill="url(#blueSkin)" transform="rotate(25 140 115)" filter="url(#shadow)"/>
  
  <!-- Hands -->
  <circle cx="48" cy="95" r="13" fill="url(#blueSkin)" filter="url(#shadow)"/>
  <circle cx="152" cy="95" r="13" fill="url(#blueSkin)" filter="url(#shadow)"/>
  
  <!-- Neck -->
  <rect x="92" y="75" width="16" height="12" fill="url(#blueSkin)" filter="url(#shadow)"/>
  
  <!-- Head -->
  <circle cx="100" cy="55" r="32" fill="url(#blueSkin)" filter="url(#shadow)"/>
  
  <!-- Cap -->
  <ellipse cx="100" cy="28" rx="28" ry="24" fill="url(#redCap)" filter="url(#shadow)"/>
  <path d="M 72 28 Q 100 12 128 28" fill="#ff6666" filter="url(#shadow)"/>
  
  <!-- Cap pom-pom -->
  <circle cx="100" cy="8" r="8" fill="#ff4444" filter="url(#shadow)"/>
  <circle cx="100" cy="8" r="6" fill="#ff7777"/>
  
  <!-- Eyes -->
  <circle cx="88" cy="48" r="6" fill="white" filter="url(#shadow)"/>
  <circle cx="112" cy="48" r="6" fill="white" filter="url(#shadow)"/>
  <circle cx="89" cy="49" r="3" fill="#000"/>
  <circle cx="113" cy="49" r="3" fill="#000"/>
  
  <!-- Eyebrows (wise expression) -->
  <path d="M 83 42 Q 88 40 93 42" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 107 42 Q 112 40 117 42" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="55" rx="3" ry="4" fill="#1a3a99" filter="url(#shadow)"/>
  
  <!-- Smile (warm expression) -->
  <path d="M 92 62 Q 100 68 108 62" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Beard detail (older appearance) -->
  <path d="M 85 68 Q 100 75 115 68" stroke="#333" stroke-width="1" opacity="0.4" fill="none" stroke-linecap="round"/>
</svg>