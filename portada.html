<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Azul y Trufa - Portada del cómic estilo Marvel vintage.">
  <title>Azul y Trufa | Portada Cómic</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700;900&display=swap');

    :root {
      --primary-blue: #1f4fb8;
      --accent-red: #d64545;
      --gold: #f5c86a;
      --forest-green: #2d5a4a;
      --cream: #fff9ed;
      --black: #000;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .comic-cover-container {
      max-width: 600px;
      width: 100%;
      perspective: 1200px;
      animation: slideInDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .comic-cover {
      background: linear-gradient(135deg, var(--cream) 0%, #f5ede0 100%);
      border: 6px solid var(--black);
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 0 0 2px var(--black),
        12px 12px 0 rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      aspect-ratio: 9/11;
      display: flex;
      flex-direction: column;
    }

    /* HEADER BANNER */
    .cover-header {
      background: linear-gradient(90deg, var(--primary-blue) 0%, #1a3d8a 100%);
      border-bottom: 4px solid var(--black);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--white);
      font-weight: 900;
      font-size: clamp(10px, 2vw, 14px);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      position: relative;
      z-index: 10;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
    }

    .header-logo {
      font-style: italic;
      text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
    }

    .header-meta {
      display: flex;
      gap: 12px;
      font-size: clamp(9px, 1.5vw, 11px);
    }

    .issue-badge {
      background: var(--accent-red);
      color: var(--white);
      padding: 4px 8px;
      border: 2px solid var(--black);
      font-weight: 900;
      border-radius: 3px;
    }

    /* CORNER BOX */
    .corner-box {
      position: absolute;
      top: 50px;
      right: 12px;
      width: 100px;
      height: 120px;
      border: 3px solid var(--black);
      background: linear-gradient(135deg, var(--primary-blue) 0%, #2764b8 100%);
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4), inset 0 0 0 1px var(--white);
    }

    .corner-box svg {
      width: 90%;
      height: 90%;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    /* MAIN CONTENT AREA */
    .cover-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 16px 12px;
      position: relative;
      overflow: hidden;
    }

    /* LOGO PRINCIPAL */
    .cover-logo {
      text-align: center;
      margin-bottom: 12px;
      animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.3s both;
      position: relative;
      z-index: 5;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-10deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .logo-text {
      font-size: clamp(28px, 8vw, 52px);
      font-weight: 900;
      color: var(--primary-blue);
      text-shadow: 
        4px 4px 0 var(--accent-red),
        8px 8px 0 var(--black),
        12px 12px 8px rgba(0, 0, 0, 0.2);
      letter-spacing: 0.03em;
      line-height: 1;
      text-transform: uppercase;
      font-style: italic;
      transform: skewX(-5deg);
      border: 4px solid var(--black);
      padding: 8px 12px;
      background: rgba(245, 193, 106, 0.6);
    }

    .logo-text span {
      color: var(--accent-red);
      font-size: 0.7em;
    }

    /* CENTRAL ARTWORK */
    .cover-art {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      z-index: 3;
      overflow: hidden;
    }

    .art-characters {
      width: 100%;
      height: 100%;
      max-height: 400px;
      animation: scaleIn 0.8s ease-out 0.2s both;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* DRAMATIC BLURBS */
    .cover-blurbs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      position: relative;
      z-index: 5;
    }

    .blurb {
      background: var(--accent-red);
      color: var(--white);
      padding: 6px 10px;
      border: 3px solid var(--black);
      font-weight: 900;
      font-size: clamp(10px, 2vw, 13px);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: center;
      transform: rotate(-2deg);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .blurb:nth-child(even) {
      transform: rotate(2deg);
      background: var(--primary-blue);
      margin-left: 20px;
    }

    .blurb::before {
      content: '★';
      color: var(--gold);
      margin-right: 6px;
      font-size: 1.2em;
    }

    /* COMICS CODE AUTHORITY */
    .code-authority {
      position: absolute;
      top: 50px;
      left: 12px;
      width: 70px;
      height: 85px;
      border: 2px solid var(--black);
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 12;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
    }

    .code-text {
      text-align: center;
      font-size: 7px;
      font-weight: 900;
      color: var(--black);
      line-height: 1.1;
      letter-spacing: 0.05em;
    }

    /* FOOTER */
    .cover-footer {
      border-top: 4px solid var(--black);
      padding: 8px 10px;
      background: linear-gradient(90deg, rgba(45, 90, 74, 0.1) 0%, transparent 100%);
      text-align: center;
      font-size: clamp(9px, 1.5vw, 11px);
      font-weight: 700;
      color: var(--black);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      position: relative;
      z-index: 5;
    }

    /* BACKGROUND EFFECTS */
    .cover-bg-effect {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0.1;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.3) 0%, transparent 50%);
    }

    /* PAGES ILLUSION */
    .comic-cover::before {
      content: '';
      position: absolute;
      top: 0;
      right: -8px;
      width: 8px;
      height: 100%;
      background: linear-gradient(90deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.3) 100%);
      z-index: 20;
    }

    /* NAV */
    .nav-section {
      margin-top: 40px;
      text-align: center;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--primary-blue) 0%, #1a3d8a 100%);
      color: var(--white);
      border: 3px solid var(--black);
      border-radius: 8px;
      font-weight: 900;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.4), 0 0 0 3px var(--black);
      display: inline-block;
    }

    .btn:hover {
      transform: translateY(-4px) rotate(-1deg);
      box-shadow: 0 12px 0 rgba(0, 0, 0, 0.4), 0 0 0 3px var(--black), 0 16px 30px rgba(31, 79, 184, 0.3);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.4), 0 0 0 3px var(--black);
    }

    .btn-secondary {
      background: linear-gradient(135deg, var(--accent-red) 0%, #b83535 100%);
    }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      .corner-box {
        width: 80px;
        height: 100px;
        top: 45px;
        right: 8px;
      }

      .code-authority {
        width: 60px;
        height: 75px;
        top: 45px;
        left: 8px;
      }

      .logo-text {
        font-size: 32px;
        padding: 6px 10px;
      }

      .cover-header {
        font-size: 11px;
      }

      .header-meta {
        gap: 8px;
      }

      .issue-badge {
        padding: 3px 6px;
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <div class="comic-cover-container">
    <div class="comic-cover">
      <!-- BACKGROUND EFFECT -->
      <div class="cover-bg-effect"></div>

      <!-- HEADER BANNER -->
      <div class="cover-header">
        <span class="header-logo">🍄 Biblioteca Bosque Encantado 🍄</span>
        <div class="header-meta">
          <span class="issue-badge">Nº 1</span>
          <span>DICIEMBRE</span>
        </div>
      </div>

      <!-- COMICS CODE AUTHORITY SEAL -->
      <div class="code-authority">
        <div class="code-text">
          APROBADO<br>POR LA<br>AUTORIDAD<br>DE CÓMICS
        </div>
      </div>

      <!-- CORNER BOX (Mini character) -->
      <div class="corner-box">
        <svg viewBox="0 0 180 240" xmlns="http://www.w3.org/2000/svg">
          <!-- Azul pequeño sonriendo -->
          <ellipse cx="90" cy="140" rx="35" ry="50" fill="var(--primary-blue)" stroke="var(--white)" stroke-width="2"/>
          <circle cx="90" cy="60" r="28" fill="var(--primary-blue)" stroke="var(--white)" stroke-width="2"/>
          <circle cx="80" cy="52" r="8" fill="var(--white)"/>
          <circle cx="100" cy="52" r="8" fill="var(--white)"/>
          <circle cx="80" cy="52" r="4" fill="var(--black)"/>
          <circle cx="100" cy="52" r="4" fill="var(--black)"/>
          <ellipse cx="90" cy="22" rx="24" ry="18" fill="var(--accent-red)" stroke="var(--white)" stroke-width="2"/>
          <circle cx="90" cy="2" r="10" fill="var(--accent-red)" stroke="var(--white)" stroke-width="2"/>
          <path d="M 75 68 Q 90 80 105 68" stroke="var(--white)" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- MAIN CONTENT -->
      <div class="cover-content">
        <!-- LOGO PRINCIPAL -->
        <div class="cover-logo">
          <div class="logo-text">AZUL <span>y</span> TRUFA</div>
        </div>

        <!-- DRAMATIC BLURBS -->
        <div class="cover-blurbs">
          <div class="blurb">¡Un Amor Imposible!</div>
          <div class="blurb">En el Corazón del Bosque</div>
          <div class="blurb">¡Acción y Magia Sin Límites!</div>
        </div>

        <!-- CENTRAL ARTWORK -->
        <div class="cover-art">
          <svg class="art-characters" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <!-- BACKGROUND EFFECT: Radiación cómica -->
            <g opacity="0.15">
              <line x1="400" y1="300" x2="100" y2="100" stroke="var(--black)" stroke-width="8"/>
              <line x1="400" y1="300" x2="700" y2="100" stroke="var(--black)" stroke-width="8"/>
              <line x1="400" y1="300" x2="150" y2="500" stroke="var(--black)" stroke-width="8"/>
              <line x1="400" y1="300" x2="650" y2="500" stroke="var(--black)" stroke-width="8"/>
            </g>

            <!-- MOON/MAGICAL GLOW -->
            <circle cx="650" cy="80" r="60" fill="var(--gold)" opacity="0.8" stroke="var(--black)" stroke-width="3"/>
            <circle cx="650" cy="80" r="50" fill="none" stroke="var(--gold)" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>

            <!-- AZUL (LEFT) - Dynamic Pose -->
            <g transform="translate(150, 200) scale(1.2)">
              <!-- Shadow -->
              <ellipse cx="0" cy="140" rx="40" ry="15" fill="var(--black)" opacity="0.2"/>
              
              <!-- Body reaching out -->
              <ellipse cx="0" cy="80" rx="32" ry="45" fill="var(--primary-blue)" stroke="var(--black)" stroke-width="3"/>
              
              <!-- Left arm stretched -->
              <ellipse cx="-45" cy="50" rx="15" ry="40" fill="var(--primary-blue)" stroke="var(--black)" stroke-width="2.5" transform="rotate(-40 -45 50)"/>
              <circle cx="-70" cy="25" r="12" fill="#f4a460" stroke="var(--black)" stroke-width="2"/>
              
              <!-- Right arm up -->
              <ellipse cx="45" cy="40" rx="14" ry="38" fill="var(--primary-blue)" stroke="var(--black)" stroke-width="2.5" transform="rotate(35 45 50)"/>
              <circle cx="70" cy="10" r="12" fill="#f4a460" stroke="var(--black)" stroke-width="2"/>
              
              <!-- Neck -->
              <rect x="-12" y="35" width="24" height="15" fill="#f4a460" stroke="var(--black)" stroke-width="2" rx="2"/>
              
              <!-- Head -->
              <circle cx="0" cy="25" r="26" fill="var(--primary-blue)" stroke="var(--black)" stroke-width="3"/>
              
              <!-- Hat -->
              <ellipse cx="0" cy="5" rx="24" ry="18" fill="var(--accent-red)" stroke="var(--black)" stroke-width="3"/>
              <circle cx="0" cy="-8" r="10" fill="var(--accent-red)" stroke="var(--black)" stroke-width="2.5"/>
              
              <!-- Eyes wide (emotion) -->
              <circle cx="-8" cy="20" r="9" fill="var(--white)" stroke="var(--black)" stroke-width="2"/>
              <circle cx="8" cy="20" r="9" fill="var(--white)" stroke="var(--black)" stroke-width="2"/>
              <circle cx="-8" cy="22" r="5" fill="var(--black)"/>
              <circle cx="8" cy="22" r="5" fill="var(--black)"/>
              <circle cx="-6" cy="18" r="3" fill="var(--white)"/>
              <circle cx="10" cy="18" r="3" fill="var(--white)"/>
              
              <!-- Mouth open (joy/determination) -->
              <path d="M -6 32 Q 0 38 6 32" stroke="var(--black)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <ellipse cx="0" cy="34" rx="8" ry="6" fill="#ffe4e1" opacity="0.8"/>
            </g>

            <!-- TRUFA (RIGHT) - Dynamic Pose Mirror -->
            <g transform="translate(650, 220) scale(1.15)">
              <!-- Shadow -->
              <ellipse cx="0" cy="140" rx="45" ry="16" fill="var(--black)" opacity="0.2"/>
              
              <!-- Roots down -->
              <path d="M -30 130 Q -40 160 -35 190" stroke="#4a3728" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
              <path d="M 0 145 Q 0 170 0 200" stroke="#4a3728" stroke-width="5.5" fill="none" stroke-linecap="round" opacity="0.8"/>
              <path d="M 30 130 Q 40 160 35 190" stroke="#4a3728" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
              
              <!-- Body (trufa shape) -->
              <ellipse cx="0" cy="70" rx="55" ry="75" fill="#a78951" stroke="var(--black)" stroke-width="3"/>
              
              <!-- Texture spots -->
              <circle cx="-25" cy="40" r="12" fill="#7d6637" opacity="0.4"/>
              <circle cx="25" cy="35" r="10" fill="#7d6637" opacity="0.4"/>
              <circle cx="-20" cy="100" r="11" fill="#7d6637" opacity="0.3"/>
              <circle cx="20" cy="110" r="13" fill="#7d6637" opacity="0.3"/>
              
              <!-- Head -->
              <circle cx="0" cy="15" r="32" fill="#a78951" stroke="var(--black)" stroke-width="3"/>
              
              <!-- Eyes big and expressive -->
              <circle cx="-12" cy="10" r="10" fill="var(--white)" stroke="var(--black)" stroke-width="2.5"/>
              <circle cx="12" cy="10" r="10" fill="var(--white)" stroke="var(--black)" stroke-width="2.5"/>
              <circle cx="-12" cy="12" r="5.5" fill="var(--forest-green)"/>
              <circle cx="12" cy="12" r="5.5" fill="var(--forest-green)"/>
              <circle cx="-10" cy="8" r="3" fill="var(--white)"/>
              <circle cx="14" cy="8" r="3" fill="var(--white)"/>
              
              <!-- Mouth sweet smile -->
              <path d="M -6 28 Q 0 33 6 28" stroke="var(--black)" stroke-width="2" fill="none" stroke-linecap="round"/>
              <ellipse cx="0" cy="30" rx="7" ry="5" fill="#ffe4e1" opacity="0.7"/>
            </g>

            <!-- MAGICAL CONNECTION - Lines between them -->
            <g stroke="var(--gold)" stroke-width="3" opacity="0.6" stroke-dasharray="8,4">
              <path d="M 250 300 Q 400 250 550 320"/>
              <path d="M 280 350 Q 400 320 520 380"/>
            </g>

            <!-- DRAMATIC EXPLOSION/ENERGY EFFECT -->
            <g stroke="var(--accent-red)" stroke-width="2" opacity="0.4" fill="none">
              <circle cx="400" cy="320" r="80"/>
              <circle cx="400" cy="320" r="120"/>
              <circle cx="400" cy="320" r="160" stroke-dasharray="10,8"/>
            </g>
          </svg>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="cover-footer">
        Una Historia de Amor Encantado | Nº 1
      </div>
    </div>

    <!-- NAVIGATION BUTTONS -->
    <div class="nav-section">
      <div class="nav-buttons">
        <a href="index.html" class="btn">📖 Leer Cómic</a>
        <a href="game.html" class="btn btn-secondary">🎮 Jugar</a>
      </div>
    </div>
  </div>

  <script>
    // Pequeña animación de hover en la portada
    const comicCover = document.querySelector('.comic-cover');
    document.addEventListener('mousemove', (e) => {
      const rect = comicCover.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      
      const rotateX = (y - 0.5) * 3;
      const rotateY = (x - 0.5) * 3;
      
      comicCover.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      comicCover.style.transform = 'rotateX(0) rotateY(0)';
    });
  </script>
</body>
</html>
