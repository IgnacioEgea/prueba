<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Azul y Trufa - Portada del cómic interactivo.">
  <title>Azul y Trufa | Portada</title>
  <style>
    :root {
      --primary-blue: #2764b8;
      --accent-red: #e63946;
      --gold: #f5c86a;
      --night: #101d3d;
      --cream: #fff9ed;
      --forest-green: #2d5a4a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Arial Black', 'Arial', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f2941 50%, #1a1a2e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      color: #fff;
    }

    .portada-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .portada-header {
      text-align: center;
      margin-bottom: 3rem;
      animation: slideDown 0.8s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .portada-header h1 {
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      color: #fff;
      text-shadow: 
        4px 4px 0 var(--primary-blue),
        8px 8px 0 rgba(0, 0, 0, 0.5),
        12px 12px 20px rgba(0, 0, 0, 0.7);
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .portada-header h1 span {
      color: var(--accent-red);
      display: block;
      font-style: italic;
    }

    .portada-subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.3rem);
      color: var(--gold);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .portada-tagline {
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: #b9e4ee;
      font-style: italic;
      font-weight: 400;
      max-width: 600px;
    }

    .characters-section {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 2rem;
      margin: 3rem 0;
      perspective: 1000px;
      animation: fadeIn 1s ease-out 0.3s both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .character {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: bounce 0.8s ease-out both;
    }

    .character:nth-child(1) {
      animation-delay: 0.5s;
      transform: scaleX(-1);
    }

    .character:nth-child(2) {
      animation-delay: 0.8s;
    }

    @keyframes bounce {
      0% {
        opacity: 0;
        transform: translateY(40px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .character-art {
      width: clamp(140px, 25vw, 220px);
      height: clamp(180px, 32vw, 280px);
      position: relative;
      filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.6));
      transition: transform 0.3s ease;
    }

    .character:hover .character-art {
      transform: scale(1.05);
    }

    .character-name {
      margin-top: 1rem;
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .azul .character-name {
      color: var(--primary-blue);
      text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.3);
    }

    .trufa .character-name {
      color: #8b6f47;
      text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.3);
    }

    .menu-section {
      margin-top: 4rem;
      animation: slideUp 0.8s ease-out 1.2s both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dropdown-menu {
      position: relative;
      display: inline-block;
    }

    .menu-button {
      background: linear-gradient(135deg, var(--primary-blue), #1a4d8f);
      color: white;
      border: 3px solid #fff;
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3), 0 10px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .menu-button:hover {
      background: linear-gradient(135deg, #1a4d8f, var(--primary-blue));
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.3), 0 12px 25px rgba(0, 0, 0, 0.5);
    }

    .menu-button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3), 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .menu-button::after {
      content: "▼";
      font-size: 0.7em;
      transition: transform 0.3s ease;
    }

    .dropdown-menu.active .menu-button::after {
      transform: rotate(180deg);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f2941 100%);
      min-width: 280px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      border: 2px solid var(--primary-blue);
      border-radius: 8px;
      z-index: 10;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 0.5rem;
      overflow: hidden;
    }

    .dropdown-menu.active .dropdown-content {
      display: block;
      animation: slideDown 0.3s ease-out;
    }

    .dropdown-item {
      display: block;
      color: white;
      padding: 1rem 1.5rem;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover {
      background: linear-gradient(90deg, var(--primary-blue), rgba(39, 100, 184, 0.5));
      padding-left: 2rem;
      color: var(--gold);
    }

    .dropdown-item::before {
      content: "▸";
      color: var(--accent-red);
      font-weight: 900;
    }

    .dropdown-item.story::before {
      content: "📖";
    }

    .dropdown-item.game::before {
      content: "🎮";
    }

    .dropdown-item.comic::before {
      content: "💭";
    }

    .footer-credits {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 1.5rem;
      background: linear-gradient(to top, rgba(16, 29, 61, 0.95), transparent);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-transform: uppercase;
      z-index: 5;
    }

    .footer-credits span {
      font-size: 1.1rem;
      font-style: italic;
      color: var(--accent-red);
      font-weight: 900;
    }

    /* Background decorative elements */
    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.6;
      animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .portada-header h1 {
        text-shadow: 
          2px 2px 0 var(--primary-blue),
          4px 4px 0 rgba(0, 0, 0, 0.5),
          6px 6px 10px rgba(0, 0, 0, 0.7);
      }

      .characters-section {
        gap: 1rem;
      }

      .menu-button {
        padding: 0.8rem 1.5rem;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      .characters-section {
        flex-direction: column;
        gap: 1rem;
      }

      .character:nth-child(1) {
        transform: scaleX(-1) translateY(20px);
      }

      .character:nth-child(2) {
        transform: translateY(-20px);
      }

      .portada-header h1 {
        font-size: 2.5rem;
      }

      .portada-subtitle {
        font-size: 0.85rem;
      }

      .portada-tagline {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-decoration">
    <div class="stars" id="stars"></div>
  </div>

  <div class="portada-container">
    <!-- Header -->
    <div class="portada-header">
      <p class="portada-subtitle">Presenta</p>
      <h1>Azul <span>y Trufa</span></h1>
      <p class="portada-tagline">Una historia de amor en el bosque encantado</p>
    </div>

    <!-- Characters -->
    <div class="characters-section">
      <div class="character azul">
        <div class="character-art">
          <svg viewBox="0 0 180 240" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <!-- Sombra -->
            <ellipse cx="90" cy="220" rx="50" ry="15" fill="#000" opacity="0.15"/>
            
            <!-- Cuerpo -->
            <ellipse cx="90" cy="140" rx="38" ry="55" fill="#2764b8" stroke="#000" stroke-width="2"/>
            
            <!-- Piernas -->
            <ellipse cx="75" cy="190" rx="12" ry="28" fill="#2764b8" stroke="#000" stroke-width="2"/>
            <ellipse cx="105" cy="190" rx="12" ry="28" fill="#2764b8" stroke="#000" stroke-width="2"/>
            
            <!-- Zapatos -->
            <ellipse cx="75" cy="218" rx="14" ry="10" fill="#333" stroke="#000" stroke-width="1.5"/>
            <ellipse cx="105" cy="218" rx="14" ry="10" fill="#333" stroke="#000" stroke-width="1.5"/>
            
            <!-- Brazos levantados (celebración) -->
            <ellipse cx="55" cy="100" rx="13" ry="40" fill="#2764b8" stroke="#000" stroke-width="2" transform="rotate(-35 55 120)"/>
            <ellipse cx="125" cy="100" rx="13" ry="40" fill="#2764b8" stroke="#000" stroke-width="2" transform="rotate(35 125 120)"/>
            
            <!-- Manos -->
            <circle cx="42" cy="75" r="12" fill="#f4a460" stroke="#000" stroke-width="2"/>
            <circle cx="138" cy="75" r="12" fill="#f4a460" stroke="#000" stroke-width="2"/>
            
            <!-- Cuello -->
            <rect x="80" y="80" width="20" height="15" fill="#f4a460" stroke="#000" stroke-width="1.5"/>
            
            <!-- Cabeza -->
            <circle cx="90" cy="60" r="32" fill="#2764b8" stroke="#000" stroke-width="2.5"/>
            
            <!-- Gorro rojo (característica de pitufo) -->
            <ellipse cx="90" cy="35" rx="28" ry="22" fill="#e63946" stroke="#000" stroke-width="2"/>
            <path d="M 65 35 Q 90 18 115 35" fill="#ff6b6b" stroke="#000" stroke-width="1.5"/>
            
            <!-- Pompom del gorro -->
            <circle cx="90" cy="10" r="10" fill="#e63946" stroke="#000" stroke-width="1.5"/>
            <circle cx="90" cy="10" r="7" fill="#ff8a8a" opacity="0.8"/>
            
            <!-- Ojos brillantes -->
            <circle cx="75" cy="50" r="7" fill="#fff" stroke="#000" stroke-width="1.5"/>
            <circle cx="105" cy="50" r="7" fill="#fff" stroke="#000" stroke-width="1.5"/>
            <circle cx="75" cy="51" r="4" fill="#000"/>
            <circle cx="105" cy="51" r="4" fill="#000"/>
            <circle cx="76" cy="49" r="2" fill="#fff"/>
            <circle cx="106" cy="49" r="2" fill="#fff"/>
            
            <!-- Cejas alegres -->
            <path d="M 68 42 Q 75 39 82 42" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M 98 42 Q 105 39 112 42" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
            
            <!-- Nariz -->
            <ellipse cx="90" cy="58" rx="3" ry="4" fill="#1a4d8f"/>
            
            <!-- Boca sonriente -->
            <path d="M 80 68 Q 90 75 100 68" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            
            <!-- Coloretes -->
            <circle cx="62" cy="60" r="6" fill="#ff9999" opacity="0.4"/>
            <circle cx="118" cy="60" r="6" fill="#ff9999" opacity="0.4"/>
          </svg>
        </div>
        <div class="character-name">Azul</div>
      </div>

      <div class="character trufa">
        <div class="character-art">
          <svg viewBox="0 0 180 280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <!-- Sombra -->
            <ellipse cx="90" cy="260" rx="55" ry="18" fill="#000" opacity="0.15"/>
            
            <!-- Raíces principales -->
            <path d="M 60 220 Q 50 245 45 270" stroke="#4a3728" stroke-width="3" fill="none"/>
            <path d="M 90 230 Q 90 255 90 275" stroke="#4a3728" stroke-width="3" fill="none"/>
            <path d="M 120 220 Q 130 245 135 270" stroke="#4a3728" stroke-width="3" fill="none"/>
            
            <!-- Raicillas pequeñas -->
            <path d="M 50 250 L 40 265" stroke="#4a3728" stroke-width="1.5" fill="none" opacity="0.7"/>
            <path d="M 130 250 L 140 265" stroke="#4a3728" stroke-width="1.5" fill="none" opacity="0.7"/>
            
            <!-- Cuerpo principal (forma de trufa) -->
            <ellipse cx="90" cy="140" rx="65" ry="85" fill="#8b6f47" stroke="#000" stroke-width="2.5"/>
            
            <!-- Textura de trufa (manchas) -->
            <circle cx="65" cy="110" r="12" fill="#6b5637" opacity="0.6"/>
            <circle cx="115" cy="105" r="10" fill="#6b5637" opacity="0.6"/>
            <circle cx="75" cy="160" r="11" fill="#6b5637" opacity="0.5"/>
            <circle cx="105" cy="170" r="13" fill="#6b5637" opacity="0.5"/>
            <circle cx="90" cy="195" r="9" fill="#6b5637" opacity="0.5"/>
            
            <!-- Brillo de trufa (lustre) -->
            <ellipse cx="70" cy="90" rx="18" ry="25" fill="#a89968" opacity="0.4"/>
            
            <!-- Cabeza/cara -->
            <circle cx="90" cy="75" r="35" fill="#8b6f47" stroke="#000" stroke-width="2.5"/>
            
            <!-- Textura de cara -->
            <circle cx="70" cy="60" r="8" fill="#6b5637" opacity="0.4"/>
            <circle cx="110" cy="65" r="7" fill="#6b5637" opacity="0.4"/>
            
            <!-- Ojos grandes y expresivos -->
            <circle cx="72" cy="70" r="9" fill="#fff" stroke="#000" stroke-width="2"/>
            <circle cx="108" cy="70" r="9" fill="#fff" stroke="#000" stroke-width="2"/>
            <circle cx="72" cy="71" r="5" fill="#2d5a4a"/>
            <circle cx="108" cy="71" r="5" fill="#2d5a4a"/>
            <circle cx="73" cy="68" r="2.5" fill="#fff"/>
            <circle cx="109" cy="68" r="2.5" fill="#fff"/>
            
            <!-- Cejas suave -->
            <path d="M 64 60 Q 72 56 80 59" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <path d="M 100 59 Q 108 56 116 60" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            
            <!-- Nariz pequeña -->
            <ellipse cx="90" cy="80" rx="2.5" ry="3.5" fill="#4a3728"/>
            
            <!-- Boca adorable (sonrisa) -->
            <path d="M 80 88 Q 90 95 100 88" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            
            <!-- Mejillas rosadas -->
            <circle cx="55" cy="78" r="8" fill="#d4a5a5" opacity="0.5"/>
            <circle cx="125" cy="78" r="8" fill="#d4a5a5" opacity="0.5"/>
            
            <!-- Aura mágica alrededor -->
            <circle cx="90" cy="140" r="70" fill="none" stroke="#d4a5a5" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
          </svg>
        </div>
        <div class="character-name">Trufa</div>
      </div>
    </div>

    <!-- Menu -->
    <div class="menu-section">
      <div class="dropdown-menu" id="dropdownMenu">
        <button class="menu-button" id="menuButton">Explora la historia</button>
        <div class="dropdown-content">
          <a href="index-old.html" class="dropdown-item story" target="_blank">La Historia Completa</a>
          <a href="game.html" class="dropdown-item game" target="_blank">Jugar Mini-Juego</a>
          <a href="index.html" class="dropdown-item comic">Ver el Cómic</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Credits -->
  <div class="footer-credits">
    Creado por <span>Blus</span>
  </div>

  <script>
    // Generate random stars
    function generateStars() {
      const starsContainer = document.getElementById('stars');
      const starCount = Math.random() > 0.5 ? 30 : 50;
      
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.animationDuration = (2 + Math.random() * 2) + 's';
        starsContainer.appendChild(star);
      }
    }

    generateStars();

    // Dropdown menu functionality
    const menuButton = document.getElementById('menuButton');
    const dropdownMenu = document.getElementById('dropdownMenu');

    menuButton.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.remove('active');
      }
    });

    // Close menu when clicking a link
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        dropdownMenu.classList.remove('active');
      });
    });
  </script>
</body>
</html>
