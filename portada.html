<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Azul y Trufa - Portada del cómic cartoon años 2000s.">
  <title>Azul y Trufa | Portada</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700;900&family=Caveat:wght@700&display=swap');

    :root {
      --primary-blue: #1f4fb8;
      --accent-red: #d64545;
      --gold: #f5c86a;
      --forest-green: #2d5a4a;
      --cream: #fff9ed;
      --dark-bg: #e8f4f8;
      --outline: #000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
      background: linear-gradient(180deg, #c8e6f5 0%, #e8f4f8 50%, #b8dce8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      color: var(--outline);
      position: relative;
    }

    /* Clouds decoration */
    .clouds-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 100px;
      opacity: 0.8;
      animation: float 20s infinite;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 100px;
    }

    .cloud::before {
      width: 50px;
      height: 50px;
      top: -25px;
      left: 10px;
    }

    .cloud::after {
      width: 60px;
      height: 60px;
      top: -15px;
      right: 10px;
    }

    @keyframes float {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(30px); }
    }

    /* Background trees */
    .trees-background {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;
      pointer-events: none;
      z-index: 0;
    }

    .portada-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 2;
    }

    /* Title with cartoon style */
    .portada-header {
      text-align: center;
      margin-bottom: 1.5rem;
      animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      z-index: 2;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.5) rotate(-5deg);
      }
      50% {
        transform: scale(1.1) rotate(2deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .portada-subtitle {
      font-size: clamp(0.8rem, 2vw, 1rem);
      color: var(--primary-blue);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 900;
      margin-bottom: 0.3rem;
      text-shadow: 3px 3px 0 rgba(255, 255, 255, 0.8);
      font-family: 'Caveat', cursive;
      font-size: 1.3em;
    }

    .portada-header h1 {
      font-size: clamp(2.5rem, 14vw, 7rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      color: var(--primary-blue);
      text-shadow: 
        4px 4px 0 var(--accent-red),
        8px 8px 0 var(--outline),
        12px 12px 0 rgba(0, 0, 0, 0.2);
      line-height: 0.95;
      margin: 0.5rem 0;
      text-transform: uppercase;
      font-style: italic;
      font-family: 'Fredoka', sans-serif;
      transform: skewX(-8deg);
    }

    .portada-header h1 span {
      color: var(--accent-red);
      display: inline;
      margin: 0 0.1em;
    }

    .portada-tagline {
      font-size: clamp(0.75rem, 1.8vw, 0.95rem);
      color: var(--forest-green);
      font-style: italic;
      font-weight: 700;
      max-width: 700px;
      letter-spacing: 0.02em;
      line-height: 1.4;
      text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.6);
    }

    /* Comic effect elements */
    .comic-burst {
      position: absolute;
      top: -30px;
      right: -50px;
      width: 200px;
      height: 200px;
      pointer-events: none;
      animation: rotate 20s linear infinite;
      opacity: 0.3;
      z-index: 1;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .star-burst {
      position: absolute;
      font-size: 3rem;
      animation: twirl 3s infinite;
    }

    @keyframes twirl {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.2) rotate(20deg); }
    }

    /* Characters section */
    .characters-section {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0.5rem;
      margin: 1rem 0 2rem 0;
      perspective: 1200px;
      animation: fadeInScale 1s ease-out 0.3s both;
      position: relative;
      z-index: 2;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.7) translateY(40px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .character {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: bounce 2s ease-in-out infinite;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.25));
    }

    .character:nth-child(1) {
      animation-delay: 0s;
      transform: scaleX(-1) rotateY(-15deg);
      margin-right: -15px;
    }

    .character:nth-child(2) {
      animation-delay: 0.2s;
      transform: rotateY(15deg);
      margin-left: -15px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotateY(var(--rotation)); }
      50% { transform: translateY(-15px) rotateY(var(--rotation)); }
    }

    .character:nth-child(1) {
      --rotation: -15deg;
    }

    .character:nth-child(2) {
      --rotation: 15deg;
    }

    .character-art {
      width: clamp(120px, 24vw, 280px);
      height: clamp(160px, 32vw, 360px);
      position: relative;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.2));
      transition: all 0.4s ease;
    }

    .character:hover .character-art {
      transform: scale(1.08) rotate(2deg);
      filter: drop-shadow(0 15px 30px rgba(29, 79, 184, 0.3));
    }

    .character-name {
      margin-top: 1rem;
      font-size: clamp(0.9rem, 2vw, 1.4rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      position: relative;
      z-index: 2;
      text-shadow: 3px 3px 0 rgba(255, 255, 255, 0.8);
      font-family: 'Fredoka', sans-serif;
    }

    .azul .character-name {
      color: var(--primary-blue);
    }

    .trufa .character-name {
      color: var(--forest-green);
    }

    /* Menu section */
    .menu-section {
      margin-top: 2rem;
      animation: slideUp 0.8s ease-out 0.8s both;
      position: relative;
      z-index: 2;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dropdown-menu {
      position: relative;
      display: inline-block;
    }

    .menu-button {
      background: linear-gradient(135deg, var(--primary-blue) 0%, #1a3d8a 100%);
      color: white;
      border: 4px solid var(--outline);
      padding: 1rem 2.2rem;
      font-size: clamp(0.9rem, 1.8vw, 1.05rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 20px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 
        0 8px 0 rgba(0, 0, 0, 0.4),
        0 0 0 3px var(--outline),
        inset 0 -3px 0 rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Fredoka', sans-serif;
      position: relative;
      overflow: visible;
    }

    .menu-button::before {
      content: '★';
      font-size: 1.3em;
      color: var(--gold);
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .menu-button:hover {
      background: linear-gradient(135deg, #1a3d8a 0%, var(--primary-blue) 100%);
      transform: translateY(-4px) rotate(-2deg);
      box-shadow: 
        0 12px 0 rgba(0, 0, 0, 0.4),
        0 0 0 3px var(--outline),
        0 16px 30px rgba(29, 79, 184, 0.3),
        inset 0 -3px 0 rgba(0, 0, 0, 0.3);
    }

    .menu-button:active {
      transform: translateY(2px);
      box-shadow: 
        0 4px 0 rgba(0, 0, 0, 0.4),
        0 0 0 3px var(--outline),
        inset 0 -2px 0 rgba(0, 0, 0, 0.3);
    }

    .menu-button::after {
      content: "▼";
      font-size: 0.6em;
      transition: transform 0.3s ease;
      display: inline-block;
    }

    .dropdown-menu.active .menu-button::after {
      transform: rotate(180deg);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background: linear-gradient(135deg, var(--cream) 0%, #fff 100%);
      min-width: 300px;
      box-shadow: 
        0 12px 30px rgba(0, 0, 0, 0.3),
        0 0 0 4px var(--outline);
      border: 4px solid var(--outline);
      border-radius: 15px;
      z-index: 20;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 1.5rem;
      overflow: hidden;
    }

    .dropdown-menu.active .dropdown-content {
      display: block;
      animation: popDown 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes popDown {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(-20px) scale(0.8);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: var(--outline);
      padding: 1.1rem 1.8rem;
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(0.85rem, 1.6vw, 0.95rem);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 2px solid rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      font-family: 'Fredoka', sans-serif;
    }

    .dropdown-item::before {
      content: "▸";
      color: var(--accent-red);
      font-weight: 900;
      font-size: 1.2em;
      transition: transform 0.2s ease;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover {
      background: linear-gradient(90deg, rgba(29, 79, 184, 0.15), transparent);
      padding-left: 2.3rem;
      color: var(--primary-blue);
      text-shadow: 0 0 5px rgba(29, 79, 184, 0.3);
    }

    .dropdown-item:hover::before {
      transform: translateX(6px) scaleX(1.3);
      color: var(--accent-red);
    }

    .dropdown-item.story::before { content: "📖"; font-size: 0.9em; }
    .dropdown-item.game::before { content: "🎮"; font-size: 0.9em; }
    .dropdown-item.comic::before { content: "💭"; font-size: 0.9em; }

    /* Footer */
    .footer-credits {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 1.5rem 1rem 1rem;
      background: linear-gradient(to top, rgba(232, 244, 248, 0.98), rgba(232, 244, 248, 0.8) 60%, transparent);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--forest-green);
      text-transform: uppercase;
      z-index: 5;
      backdrop-filter: blur(5px);
      border-top: 3px solid var(--outline);
    }

    .footer-credits span {
      display: inline-block;
      font-size: 1.2rem;
      font-style: italic;
      color: var(--primary-blue);
      font-weight: 900;
      text-shadow: 3px 3px 0 rgba(255, 255, 255, 0.8);
      margin: 0 0.4em;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .characters-section {
        gap: 0;
        margin: 1rem 0 1.5rem 0;
      }

      .character:nth-child(1) {
        margin-right: -10px;
      }

      .character:nth-child(2) {
        margin-left: -10px;
      }

      .menu-button {
        padding: 0.9rem 2rem;
        font-size: 0.95rem;
      }

      .dropdown-content {
        min-width: 280px;
      }

      .portada-header h1 {
        transform: skewX(-5deg);
      }
    }

    @media (max-width: 480px) {
      .portada-container {
        padding: 1rem;
      }

      .portada-header {
        margin-bottom: 0.8rem;
      }

      .portada-header h1 {
        font-size: 2rem;
        transform: skewX(-3deg);
      }

      .portada-subtitle {
        font-size: 1.1rem;
      }

      .portada-tagline {
        font-size: 0.7rem;
      }

      .characters-section {
        flex-direction: column;
        gap: 0;
        margin: 0.8rem 0 1.2rem 0;
      }

      .character:nth-child(1) {
        transform: scaleX(-1) rotateY(-8deg) translateY(20px);
        margin-right: 0;
      }

      .character:nth-child(2) {
        transform: rotateY(8deg) translateY(-20px);
        margin-left: 0;
      }

      .menu-button {
        padding: 0.8rem 1.8rem;
        font-size: 0.85rem;
      }

      .footer-credits {
        padding: 1rem 0.8rem 0.8rem;
        font-size: 0.8rem;
      }

      .footer-credits span {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Background clouds -->
  <div class="clouds-bg" id="cloudsContainer"></div>

  <!-- Background trees -->
  <div class="trees-background">
    <svg width="100%" height="100%" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice">
      <!-- Tree 1 (left) -->
      <ellipse cx="100" cy="120" rx="60" ry="100" fill="#2d5a4a" opacity="0.4"/>
      <rect x="80" y="200" width="40" height="80" fill="#3d4630" opacity="0.4"/>
      
      <!-- Tree 2 (center) -->
      <ellipse cx="600" cy="80" rx="80" ry="120" fill="#2d5a4a" opacity="0.3"/>
      <rect x="570" y="180" width="60" height="100" fill="#3d4630" opacity="0.3"/>
      
      <!-- Tree 3 (right) -->
      <ellipse cx="1100" cy="130" rx="70" ry="110" fill="#2d5a4a" opacity="0.35"/>
      <rect x="1075" y="210" width="50" height="90" fill="#3d4630" opacity="0.35"/>
    </svg>
  </div>

  <!-- Main container -->
  <div class="portada-container">
    <!-- Header -->
    <div class="portada-header">
      <div class="comic-burst">
        <div class="star-burst">⭐</div>
      </div>
      <p class="portada-subtitle">¡Presenta!</p>
      <h1>Azul <span>y</span> Trufa</h1>
      <p class="portada-tagline">Una épica cartoon de amor en el bosque encantado</p>
    </div>

    <!-- Characters -->
    <div class="characters-section">
      <!-- AZUL (Pitufo) -->
      <div class="character azul">
        <div class="character-art">
          <svg viewBox="0 0 180 240" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));">
            <!-- Sombra -->
            <ellipse cx="90" cy="230" rx="50" ry="15" fill="#000" opacity="0.15"/>
            
            <!-- Cuerpo cartoon -->
            <ellipse cx="90" cy="140" rx="42" ry="58" fill="var(--primary-blue)" stroke="var(--outline)" stroke-width="3"/>
            
            <!-- Piernas cortas y gruesas -->
            <ellipse cx="70" cy="195" rx="14" ry="32" fill="var(--primary-blue)" stroke="var(--outline)" stroke-width="2.5"/>
            <ellipse cx="110" cy="195" rx="14" ry="32" fill="var(--primary-blue)" stroke="var(--outline)" stroke-width="2.5"/>
            
            <!-- Zapatos enormes y cómicos -->
            <ellipse cx="70" cy="228" rx="18" ry="12" fill="#000" stroke="var(--outline)" stroke-width="2"/>
            <ellipse cx="110" cy="228" rx="18" ry="12" fill="#000" stroke="var(--outline)" stroke-width="2"/>
            <ellipse cx="70" cy="224" rx="13" ry="7" fill="#333" opacity="0.6"/>
            <ellipse cx="110" cy="224" rx="13" ry="7" fill="#333" opacity="0.6"/>
            
            <!-- Brazos levantados (celebración exagerada) -->
            <ellipse cx="45" cy="105" rx="16" ry="45" fill="var(--primary-blue)" stroke="var(--outline)" stroke-width="2.5" transform="rotate(-35 45 125)"/>
            <ellipse cx="135" cy="105" rx="16" ry="45" fill="var(--primary-blue)" stroke="var(--outline)" stroke-width="2.5" transform="rotate(35 135 125)"/>
            
            <!-- Manos grandes y divertidas -->
            <circle cx="32" cy="60" r="14" fill="#f4a460" stroke="var(--outline)" stroke-width="2.5"/>
            <circle cx="148" cy="60" r="14" fill="#f4a460" stroke="var(--outline)" stroke-width="2.5"/>
            
            <!-- Dedos -->
            <circle cx="24" cy="50" r="4" fill="#f4a460"/>
            <circle cx="23" cy="65" r="4" fill="#f4a460"/>
            <circle cx="156" cy="50" r="4" fill="#f4a460"/>
            <circle cx="157" cy="65" r="4" fill="#f4a460"/>
            
            <!-- Cuello -->
            <rect x="80" y="82" width="20" height="18" fill="#f4a460" stroke="var(--outline)" stroke-width="2" rx="3"/>
            
            <!-- Cabeza grande y redonda -->
            <circle cx="90" cy="58" r="35" fill="var(--primary-blue)" stroke="var(--outline)" stroke-width="3"/>
            
            <!-- Gorro rojo exagerado (tipo gnomo) -->
            <ellipse cx="90" cy="30" rx="32" ry="26" fill="var(--accent-red)" stroke="var(--outline)" stroke-width="3"/>
            <path d="M 62 32 Q 90 8 118 32" fill="#ff6b6b" stroke="var(--outline)" stroke-width="2"/>
            
            <!-- Pompom enorme y ridículo -->
            <circle cx="90" cy="2" r="13" fill="var(--accent-red)" stroke="var(--outline)" stroke-width="2.5"/>
            <circle cx="90" cy="2" r="9" fill="#ff9999" opacity="0.7"/>
            <circle cx="87" cy="-2" r="4" fill="#fff" opacity="0.7"/>
            <circle cx="93" cy="0" r="3" fill="#fff" opacity="0.5"/>
            
            <!-- Ojos ENORMES y expresivos (típico cartoon 2000s) -->
            <circle cx="72" cy="48" r="10" fill="#fff" stroke="var(--outline)" stroke-width="2"/>
            <circle cx="108" cy="48" r="10" fill="#fff" stroke="var(--outline)" stroke-width="2"/>
            
            <!-- Iris grandes que comunican emoción -->
            <circle cx="72" cy="50" r="5.5" fill="#000"/>
            <circle cx="108" cy="50" r="5.5" fill="#000"/>
            
            <!-- Brillos cartoonizados -->
            <circle cx="75" cy="45" r="3.5" fill="#fff"/>
            <circle cx="111" cy="45" r="3.5" fill="#fff"/>
            <circle cx="70" cy="53" r="2" fill="#fff" opacity="0.5"/>
            <circle cx="106" cy="53" r="2" fill="#fff" opacity="0.5"/>
            
            <!-- Cejas exageradas y divertidas -->
            <path d="M 64 38 Q 72 32 80 36" stroke="var(--outline)" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 100 36 Q 108 32 116 38" stroke="var(--outline)" stroke-width="3" fill="none" stroke-linecap="round"/>
            
            <!-- Nariz pequeña pero visible -->
            <ellipse cx="90" cy="58" rx="4" ry="6" fill="#1f4fb8" stroke="var(--outline)" stroke-width="1.5"/>
            
            <!-- Boca enorme sonriendo (típico cartoon) -->
            <path d="M 75 70 Q 90 82 105 70" stroke="var(--outline)" stroke-width="3" fill="none" stroke-linecap="round"/>
            <ellipse cx="90" cy="74" rx="16" ry="9" fill="#ffe4e1" opacity="0.8" stroke="var(--outline)" stroke-width="2"/>
            <path d="M 75 70 Q 90 78 105 70" stroke="#ff6b9d" stroke-width="2" fill="none" stroke-linecap="round"/>
            
            <!-- Mejillas enorme rosas (exageración cartoon) -->
            <circle cx="55" cy="60" r="11" fill="#ff9999" opacity="0.6"/>
            <circle cx="125" cy="60" r="11" fill="#ff9999" opacity="0.6"/>
            <circle cx="53" cy="62" r="6" fill="#ffaaaa" opacity="0.4"/>
            <circle cx="127" cy="62" r="6" fill="#ffaaaa" opacity="0.4"/>
            
            <!-- Detalles de ropa -->
            <g stroke="var(--outline)" stroke-width="1.5" fill="none">
              <line x1="75" y1="155" x2="75" y2="175"/>
              <line x1="105" y1="155" x2="105" y2="175"/>
            </g>
          </svg>
        </div>
        <div class="character-name">Azul</div>
      </div>

      <!-- TRUFA (Hongo/Trufa) -->
      <div class="character trufa">
        <div class="character-art">
          <svg viewBox="0 0 180 280" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));">
            <!-- Sombra -->
            <ellipse cx="90" cy="265" rx="55" ry="18" fill="#000" opacity="0.15"/>
            
            <!-- Raíces principales curvas y divertidas -->
            <path d="M 60 230 Q 40 250 30 275" stroke="#4a3728" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
            <path d="M 90 240 Q 90 260 90 280" stroke="#4a3728" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.8"/>
            <path d="M 120 230 Q 140 250 150 275" stroke="#4a3728" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>

  <script>
    // Generate clouds
    function generateClouds() {
      const container = document.getElementById('cloudsContainer');
      const cloudCount = 8;
      
      for (let i = 0; i < cloudCount; i++) {
        const cloud = document.createElement('div');
        cloud.className = 'cloud';
        cloud.style.left = (Math.random() * 100) + '%';
        cloud.style.top = (Math.random() * 40) + '%';
        cloud.style.width = (40 + Math.random() * 60) + 'px';
        cloud.style.height = (30 + Math.random() * 40) + 'px';
        cloud.style.animationDuration = (15 + Math.random() * 15) + 's';
        cloud.style.animationDelay = (Math.random() * 5) + 's';
        container.appendChild(cloud);
      }
    }

    generateClouds();

    // Dropdown menu functionality
    const menuButton = document.getElementById('menuButton');
    const dropdownMenu = document.getElementById('dropdownMenu');

    menuButton.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.remove('active');
      }
    });

    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        dropdownMenu.classList.remove('active');
      });
    });

    // Add fun easter egg interaction
    document.querySelectorAll('.character-art svg').forEach(svg => {
      svg.style.cursor = 'pointer';
      svg.addEventListener('click', (e) => {
        e.currentTarget.style.animation = 'spin 0.5s ease-in-out';
        setTimeout(() => {
          e.currentTarget.style.animation = '';
        }, 500);
      });
    });
  </script>
