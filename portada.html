<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Azul y Trufa - Portada del cómic interactivo estilo Marvel.">
  <title>Azul y Trufa | Portada Cómic</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Righteous:wght@400;700&display=swap');

    :root {
      --primary-blue: #2764b8;
      --accent-red: #e63946;
      --gold: #f5c86a;
      --night: #101d3d;
      --cream: #fff9ed;
      --forest-green: #2d5a4a;
      --dark-shadow: #0a0e1a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Righteous', 'Arial Black', sans-serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1a2e 25%, #0f2941 50%, #1a1a2e 75%, #0a0e1a 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      color: #fff;
      position: relative;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* Rayos de luz radiante de fondo */
    .light-rays {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200%;
      height: 200%;
      transform: translate(-50%, -50%);
      background: 
        repeating-conic-gradient(
          from 0deg at 50% 50%,
          rgba(39, 100, 184, 0.03) 0deg,
          transparent 3deg,
          transparent 6deg
        );
      animation: rotateRays 20s linear infinite;
    }

    @keyframes rotateRays {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Estrellas titilantes */
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.4;
      animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    /* Partículas flotantes mágicas */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: radial-gradient(circle, #f5c86a, rgba(245, 200, 106, 0.1));
      border-radius: 50%;
      opacity: 0.5;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0; }
      50% { transform: translateY(-30px) translateX(15px); opacity: 0.8; }
    }

    .portada-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .portada-header {
      text-align: center;
      margin-bottom: 2rem;
      animation: slideDown 1s ease-out;
      position: relative;
      z-index: 2;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .portada-subtitle {
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: var(--accent-red);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 10px rgba(230, 57, 70, 0.4);
    }

    .portada-header h1 {
      font-size: clamp(2.8rem, 12vw, 6.5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #fff;
      text-shadow: 
        3px 3px 0 var(--primary-blue),
        6px 6px 0 var(--accent-red),
        9px 9px 0 rgba(0, 0, 0, 0.7),
        12px 12px 30px rgba(0, 0, 0, 0.9),
        0 0 40px rgba(39, 100, 184, 0.5);
      line-height: 0.95;
      margin: 1rem 0;
      text-transform: uppercase;
      font-style: italic;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.8));
    }

    .portada-header h1 span {
      color: var(--accent-red);
      display: inline;
      margin-left: 0.2em;
    }

    .portada-tagline {
      font-size: clamp(0.8rem, 2vw, 1rem);
      color: var(--gold);
      font-style: italic;
      font-weight: 400;
      max-width: 700px;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      line-height: 1.5;
    }

    .characters-section {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0 3rem 0;
      perspective: 1000px;
      animation: fadeInScale 1.2s ease-out 0.3s both;
      position: relative;
      z-index: 2;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .character {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) both;
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.8));
    }

    .character:nth-child(1) {
      animation-delay: 0.4s;
      transform: scaleX(-1) perspective(800px) rotateY(-15deg);
      margin-right: -20px;
    }

    .character:nth-child(2) {
      animation-delay: 0.7s;
      transform: perspective(800px) rotateY(15deg);
      margin-left: -20px;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.3) translateY(60px);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .character:hover .character-art {
      transform: scale(1.08) translateY(-8px);
      filter: drop-shadow(0 20px 40px rgba(230, 57, 70, 0.4));
    }

    .character-art {
      width: clamp(130px, 26vw, 240px);
      height: clamp(170px, 34vw, 320px);
      position: relative;
      filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.7));
      transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
    }

    .character-frame {
      position: absolute;
      inset: -8px;
      border: 3px solid var(--accent-red);
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .character:hover .character-frame {
      opacity: 1;
      box-shadow: 0 0 20px rgba(230, 57, 70, 0.6);
    }

    .character-name {
      margin-top: 1.5rem;
      font-size: clamp(0.95rem, 2.2vw, 1.5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      position: relative;
      z-index: 2;
    }

    .azul .character-name {
      color: var(--primary-blue);
      text-shadow: 
        2px 2px 0 rgba(255, 255, 255, 0.4),
        4px 4px 0 rgba(0, 0, 0, 0.5);
    }

    .trufa .character-name {
      color: #c9a861;
      text-shadow: 
        2px 2px 0 rgba(255, 255, 255, 0.4),
        4px 4px 0 rgba(0, 0, 0, 0.5);
    }

    .menu-section {
      margin-top: 3rem;
      animation: slideUp 0.8s ease-out 1.5s both;
      position: relative;
      z-index: 2;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dropdown-menu {
      position: relative;
      display: inline-block;
    }

    .menu-button {
      background: linear-gradient(135deg, var(--primary-blue) 0%, #1a4d8f 100%);
      color: white;
      border: 4px solid var(--accent-red);
      padding: 1.2rem 2.5rem;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
      box-shadow: 
        0 8px 0 rgba(0, 0, 0, 0.4),
        0 12px 30px rgba(39, 100, 184, 0.6),
        inset 0 -4px 0 rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Righteous', sans-serif;
      position: relative;
      overflow: hidden;
    }

    .menu-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .menu-button:hover::before {
      left: 100%;
    }

    .menu-button:hover {
      background: linear-gradient(135deg, #1a4d8f 0%, var(--primary-blue) 100%);
      transform: translateY(-4px);
      box-shadow: 
        0 12px 0 rgba(0, 0, 0, 0.4),
        0 16px 40px rgba(230, 57, 70, 0.7),
        inset 0 -4px 0 rgba(0, 0, 0, 0.3);
    }

    .menu-button:active {
      transform: translateY(2px);
      box-shadow: 
        0 2px 0 rgba(0, 0, 0, 0.4),
        0 6px 15px rgba(39, 100, 184, 0.4),
        inset 0 -2px 0 rgba(0, 0, 0, 0.3);
    }

    .menu-button::after {
      content: "▼";
      font-size: 0.7em;
      transition: transform 0.3s ease;
      display: inline-block;
    }

    .dropdown-menu.active .menu-button::after {
      transform: rotate(180deg);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1a2e 100%);
      min-width: 320px;
      box-shadow: 
        0 16px 40px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(39, 100, 184, 0.3);
      border: 3px solid var(--primary-blue);
      border-radius: 12px;
      z-index: 20;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 1rem;
      overflow: hidden;
    }

    .dropdown-menu.active .dropdown-content {
      display: block;
      animation: popDown 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes popDown {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-20px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: white;
      padding: 1.2rem 1.8rem;
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(0.9rem, 1.8vw, 1rem);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 2px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.23, 1, 0.320, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      font-family: 'Righteous', sans-serif;
    }

    .dropdown-item::before {
      content: "▸";
      color: var(--accent-red);
      font-weight: 900;
      font-size: 1.2em;
      transition: transform 0.3s ease;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item::after {
      content: '';
      position: absolute;
      top: 0;
      right: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(39, 100, 184, 0.3), transparent);
      transition: right 0.4s ease;
      pointer-events: none;
    }

    .dropdown-item:hover {
      background: linear-gradient(90deg, var(--primary-blue), rgba(39, 100, 184, 0.4));
      padding-left: 2.3rem;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(245, 200, 106, 0.5);
    }

    .dropdown-item:hover::after {
      right: 100%;
    }

    .dropdown-item:hover::before {
      transform: translateX(6px) scaleX(1.3);
    }

    .dropdown-item.story::before { content: "📖"; font-size: 1em; }
    .dropdown-item.game::before { content: "🎮"; font-size: 1em; }
    .dropdown-item.comic::before { content: "💭"; font-size: 1em; }

    .footer-credits {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 2rem 1.5rem 1.5rem;
      background: linear-gradient(to top, rgba(10, 14, 26, 0.98), rgba(10, 14, 26, 0.8) 50%, transparent);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--gold);
      text-transform: uppercase;
      z-index: 5;
      backdrop-filter: blur(10px);
    }

    .footer-credits span {
      display: inline-block;
      font-size: 1.3rem;
      font-style: italic;
      color: var(--accent-red);
      font-weight: 900;
      text-shadow: 0 2px 8px rgba(230, 57, 70, 0.4);
      margin: 0 0.5em;
    }

    @media (max-width: 768px) {
      .portada-header h1 {
        text-shadow: 
          2px 2px 0 var(--primary-blue),
          4px 4px 0 var(--accent-red),
          6px 6px 0 rgba(0, 0, 0, 0.7),
          0 0 30px rgba(39, 100, 184, 0.4);
      }

      .characters-section {
        gap: 0.5rem;
        margin: 1.5rem 0 2rem 0;
      }

      .character:nth-child(1) {
        margin-right: -10px;
      }

      .character:nth-child(2) {
        margin-left: -10px;
      }

      .menu-button {
        padding: 1rem 2rem;
        font-size: 1rem;
      }

      .dropdown-content {
        min-width: 280px;
      }

      .dropdown-item {
        padding: 1rem 1.5rem;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      .portada-container {
        padding: 1rem;
      }

      .portada-header {
        margin-bottom: 1rem;
      }

      .portada-header h1 {
        font-size: 2.2rem;
        text-shadow: 
          2px 2px 0 var(--primary-blue),
          3px 3px 0 var(--accent-red),
          0 0 20px rgba(39, 100, 184, 0.3);
      }

      .portada-subtitle {
        font-size: 0.8rem;
      }

      .portada-tagline {
        font-size: 0.75rem;
      }

      .characters-section {
        flex-direction: column;
        gap: 0;
        margin: 1rem 0 1.5rem 0;
      }

      .character:nth-child(1) {
        transform: scaleX(-1) perspective(600px) rotateY(-10deg) translateY(30px);
        margin-right: 0;
      }

      .character:nth-child(2) {
        transform: perspective(600px) rotateY(10deg) translateY(-30px);
        margin-left: 0;
      }

      .character-art {
        width: 120px;
        height: 160px;
      }

      .menu-button {
        padding: 0.9rem 1.8rem;
        font-size: 0.9rem;
      }

      .footer-credits {
        padding: 1.5rem 1rem 1rem;
        font-size: 0.85rem;
      }

      .footer-credits span {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-decoration">
    <div class="light-rays"></div>
    <div class="stars" id="stars"></div>
    <div class="particles" id="particles"></div>
  </div>

  <div class="portada-container">
    <!-- Header -->
    <div class="portada-header">
      <p class="portada-subtitle">¡Presenta!</p>
      <h1>Azul <span>y Trufa</span></h1>
      <p class="portada-tagline">Una épica de amor en el bosque encantado</p>
    </div>

    <!-- Characters -->
    <div class="characters-section">
      <div class="character azul">
        <div class="character-art">
          <div class="character-frame"></div>
          <svg viewBox="0 0 180 240" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <!-- Sombra dinámica -->
            <ellipse cx="90" cy="220" rx="52" ry="18" fill="#000" opacity="0.25" filter="blur(4px)"/>
            
            <!-- Cuerpo -->
            <ellipse cx="90" cy="140" rx="38" ry="55" fill="#2764b8" stroke="#000" stroke-width="2.5"/>
            
            <!-- Piernas -->
            <ellipse cx="75" cy="190" rx="12" ry="28" fill="#2764b8" stroke="#000" stroke-width="2"/>
            <ellipse cx="105" cy="190" rx="12" ry="28" fill="#2764b8" stroke="#000" stroke-width="2"/>
            
            <!-- Zapatos brillantes -->
            <ellipse cx="75" cy="218" rx="14" ry="10" fill="#222" stroke="#000" stroke-width="1.5"/>
            <ellipse cx="75" cy="216" rx="10" ry="6" fill="#444" opacity="0.6"/>
            <ellipse cx="105" cy="218" rx="14" ry="10" fill="#222" stroke="#000" stroke-width="1.5"/>
            <ellipse cx="105" cy="216" rx="10" ry="6" fill="#444" opacity="0.6"/>
            
            <!-- Brazos levantados (celebración) -->
            <ellipse cx="55" cy="100" rx="13" ry="40" fill="#2764b8" stroke="#000" stroke-width="2" transform="rotate(-35 55 120)"/>
            <ellipse cx="125" cy="100" rx="13" ry="40" fill="#2764b8" stroke="#000" stroke-width="2" transform="rotate(35 125 120)"/>
            
            <!-- Manos -->
            <circle cx="42" cy="75" r="12" fill="#f4a460" stroke="#000" stroke-width="2"/>
            <circle cx="138" cy="75" r="12" fill="#f4a460" stroke="#000" stroke-width="2"/>
            <circle cx="42" cy="73" r="6" fill="#e8996a" opacity="0.5"/>
            <circle cx="138" cy="73" r="6" fill="#e8996a" opacity="0.5"/>
            
            <!-- Cuello -->
            <rect x="80" y="80" width="20" height="15" fill="#f4a460" stroke="#000" stroke-width="1.5" rx="2"/>
            
            <!-- Cabeza -->
            <circle cx="90" cy="60" r="32" fill="#2764b8" stroke="#000" stroke-width="2.5"/>
            
            <!-- Gorro rojo (característica de pitufo) -->
            <ellipse cx="90" cy="35" rx="28" ry="22" fill="#e63946" stroke="#000" stroke-width="2.5"/>
            <path d="M 65 35 Q 90 18 115 35" fill="#ff7a7a" stroke="#000" stroke-width="1.5"/>
            
            <!-- Pompom del gorro con brillo -->
            <circle cx="90" cy="10" r="10" fill="#e63946" stroke="#000" stroke-width="1.5"/>
            <circle cx="90" cy="10" r="7" fill="#ff9999" opacity="0.8"/>
            <circle cx="87" cy="7" r="3" fill="#fff" opacity="0.6"/>
            
            <!-- Ojos brillantes con vida -->
            <circle cx="75" cy="50" r="7" fill="#fff" stroke="#000" stroke-width="1.5"/>
            <circle cx="105" cy="50" r="7" fill="#fff" stroke="#000" stroke-width="1.5"/>
            <circle cx="75" cy="51" r="4" fill="#000"/>
            <circle cx="105" cy="51" r="4" fill="#000"/>
            <circle cx="77" cy="48" r="2.5" fill="#fff"/>
            <circle cx="107" cy="48" r="2.5" fill="#fff"/>
            
            <!-- Cejas alegres -->
            <path d="M 68 42 Q 75 38 82 42" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M 98 42 Q 105 38 112 42" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            
            <!-- Nariz -->
            <ellipse cx="90" cy="58" rx="3" ry="5" fill="#1a4d8f"/>
            
            <!-- Boca sonriente -->
            <path d="M 80 68 Q 90 76 100 68" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M 82 68 Q 90 74 98 68" stroke="#fff" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
            
            <!-- Coloretes -->
            <circle cx="62" cy="60" r="7" fill="#ff9999" opacity="0.5"/>
            <circle cx="118" cy="60" r="7" fill="#ff9999" opacity="0.5"/>
            
            <!-- Brillo general -->
            <ellipse cx="70" cy="40" rx="20" ry="30" fill="#fff" opacity="0.1" rx="25" ry="35"/>
          </svg>
        </div>
        <div class="character-name">Azul</div>
      </div>

      <div class="character trufa">
        <div class="character-art">
          <div class="character-frame"></div>
          <svg viewBox="0 0 180 280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <!-- Sombra dinámica -->
            <ellipse cx="90" cy="260" rx="58" ry="20" fill="#000" opacity="0.25" filter="blur(4px)"/>
            
            <!-- Raíces principales con gradiente -->
            <defs>
              <linearGradient id="rootGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#6b5637;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#4a3728;stop-opacity:0.8" />
              </linearGradient>
            </defs>
            
            <path d="M 60 220 Q 50 245 45 270" stroke="url(#rootGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M 90 230 Q 90 255 90 275" stroke="url(#rootGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M 120 220 Q 130 245 135 270" stroke="url(#rootGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            
            <!-- Raicillas pequeñas -->
            <path d="M 50 250 L 40 265" stroke="#4a3728" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round"/>
            <path d="M 130 250 L 140 265" stroke="#4a3728" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round"/>
            
            <!-- Cuerpo principal (forma de trufa) -->
            <ellipse cx="90" cy="140" rx="66" ry="87" fill="#8b6f47" stroke="#000" stroke-width="3"/>
            
            <!-- Textura de trufa (manchas) -->
            <circle cx="65" cy="110" r="13" fill="#6b5637" opacity="0.7"/>

  <script>
    // Generate random stars
    function generateStars() {
      const starsContainer = document.getElementById('stars');
      const starCount = 50;
      
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = (Math.random() * 3) + 's';
        star.style.animationDuration = (2 + Math.random() * 3) + 's';
        starsContainer.appendChild(star);
      }
    }

    // Generate floating particles
    function generateParticles() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 30;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = (Math.random() * 6) + 's';
        particle.style.animationDuration = (5 + Math.random() * 4) + 's';
        particlesContainer.appendChild(particle);
      }
    }

    generateStars();
    generateParticles();

    // Dropdown menu functionality
    const menuButton = document.getElementById('menuButton');
    const dropdownMenu = document.getElementById('dropdownMenu');

    menuButton.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.remove('active');
      }
    });

    // Close menu when clicking a link
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        dropdownMenu.classList.remove('active');
      });
    });

    // Add parallax effect on mouse move
    document.addEventListener('mousemove', (e) => {
      const rays = document.querySelector('.light-rays');
      const xPercent = (e.clientX / window.innerWidth) - 0.5;
      const yPercent = (e.clientY / window.innerHeight) - 0.5;
      
      if (rays) {
        rays.style.transform = `translate(calc(-50% + ${xPercent * 20}px), calc(-50% + ${yPercent * 20}px)) rotate(0deg)`;
      }
    });
  </script>
